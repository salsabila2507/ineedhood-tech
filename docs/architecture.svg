<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-label="Architecture: browser, bridge, hermes planner, opencode workers, workspace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a8834e"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8d7452"/>
    </marker>
    <style>
      .box { fill: #f7efdf; stroke: #c9a063; stroke-width: 1.4; }
      .t { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #2a1f17; }
      .b { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #6b5a45; }
      .l { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #8d7452; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #7a6448; }
      .a { stroke: #a8834e; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .ad { stroke: #8d7452; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrowDim); }
    </style>
  </defs>

  <!-- browser -->
  <rect class="box" x="40" y="120" width="210" height="110" rx="6"/>
  <text class="t" x="58" y="146">Browser</text>
  <text class="b" x="58" y="166">React 19 + three.js</text>
  <text class="b" x="58" y="184">one tab, one room</text>
  <text class="m" x="58" y="208">token in localStorage</text>

  <!-- bridge -->
  <rect class="box" x="320" y="120" width="250" height="110" rx="6"/>
  <text class="t" x="338" y="146">server/bridge.mjs</text>
  <text class="b" x="338" y="166">serves dist, exposes /api</text>
  <text class="b" x="338" y="184">streams state over SSE</text>
  <text class="m" x="338" y="208">plain node, no dependencies</text>

  <!-- hermes -->
  <rect class="box" x="650" y="40" width="210" height="95" rx="6"/>
  <text class="t" x="668" y="66">hermes</text>
  <text class="b" x="668" y="86">reads the prompt</text>
  <text class="b" x="668" y="104">writes the plan as JSON</text>

  <!-- opencode -->
  <rect class="box" x="650" y="230" width="210" height="95" rx="6"/>
  <text class="t" x="668" y="256">opencode x4</text>
  <text class="b" x="668" y="276">one private dir per worker</text>
  <text class="b" x="668" y="294">runs in parallel</text>

  <!-- workspace -->
  <rect class="box" x="920" y="230" width="170" height="95" rx="6"/>
  <text class="t" x="938" y="256">workspace</text>
  <text class="b" x="938" y="276">run/&lt;id&gt;/&lt;agent&gt;/</text>
  <text class="b" x="938" y="294">the real artifacts</text>

  <!-- icm -->
  <rect class="box" x="320" y="270" width="250" height="70" rx="6"/>
  <text class="t" x="338" y="296">ICM memory</text>
  <text class="b" x="338" y="316">one SQLite file, read by /api/knowledge</text>

  <!-- arrows -->
  <path class="a" d="M250 175 L316 175"/>
  <text class="l" x="283" y="167" text-anchor="middle">prompt</text>

  <path class="a" d="M570 150 L610 150 L610 88 L646 88"/>

  <path class="a" d="M570 200 L610 200 L610 278 L646 278"/>

  <path class="a" d="M860 278 L916 278"/>
  <text class="l" x="888" y="270" text-anchor="middle">files</text>

  <path class="a" d="M445 230 L445 266"/>
  <text class="l" x="452" y="254">read</text>

  <path class="ad" d="M1005 325 L1005 400 L145 400 L145 234"/>
  <text class="l" x="575" y="393" text-anchor="middle">SSE /api/stream, state flows back to the UI</text>

  <!-- legend -->
  <g transform="translate(40 366)">
    <line class="a" x1="0" y1="8" x2="34" y2="8"/>
    <text class="l" x="42" y="12">command</text>
    <line class="ad" x1="120" y1="8" x2="154" y2="8"/>
    <text class="l" x="162" y="12">events</text>
  </g>
</svg>
